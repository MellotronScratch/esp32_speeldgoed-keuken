# Speelgoedkeuken, voor de ESPHome Device Builder in Home Assistant.
# Kopieer dit naar de YAML van je apparaat. De kookplaten worden van GitHub gehaald.
# Nodig in Secrets: wifi_ssid, wifi_password, keukentje__api_key en keukentje__ota_password
# (die laatste twee maakt de Device Builder zelf aan).

esphome:
  name: keukentje
  friendly_name: Keukentje

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret keukentje__api_key

ota:
  - platform: esphome
    password: !secret keukentje__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Keukentje-Setup
    # Verzin zelf een wachtwoord van minstens 8 tekens.
    password: "kies-een-wachtwoord"

captive_portal:

packages:
  kookplaten:
    url: https://github.com/MellotronScratch/esp32_speeldgoed-keuken
    ref: main
    files: [esphome/kookplaten.yaml]
    # Hoe vaak ESPHome GitHub opnieuw ophaalt. Zet tijdelijk op 0s om een
    # wijziging direct mee te nemen.
    refresh: 1d
