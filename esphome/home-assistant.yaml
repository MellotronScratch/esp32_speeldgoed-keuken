# Speelgoedkeuken, voor de ESPHome Device Builder in Home Assistant.
# Kopieer dit naar de YAML van je apparaat. De kookplaten worden van GitHub gehaald.
# Nodig in Secrets: wifi_ssid, wifi_password en keukentje__api_key.

esphome:
  name: keukentje
  friendly_name: Keukentje

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret keukentje__api_key

ota:
  - platform: esphome
    # Leeg laten: ESPHome vult de sleutel zelf in.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Keukentje-Setup
    # Verzin zelf een wachtwoord van minstens 8 tekens.
    password: kies-een-wachtwoord
captive_portal:

packages:
  kookplaten:
    url: https://github.com/MellotronScratch/esp32_speeldgoed-keuken
    ref: main
    files: [esphome/kookplaten.yaml]
    # 0d: haal GitHub bij elke build opnieuw op, zodat een wijziging meteen meekomt.
    refresh: 0d
