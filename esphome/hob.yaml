# Eén kookplaat: één draaiknop (rotary encoder met drukknop) en één LED-ringset.
# Wordt vier keer ingeladen vanuit keukentje.yaml.

sensor:
  - platform: rotary_encoder
    id: knob_${index}
    internal: true
    pin_a:
      number: ${pin_a}
      mode:
        input: true
        pullup: ${pullup}
    pin_b:
      number: ${pin_b}
      mode:
        input: true
        pullup: ${pullup}
    # Telt hij maar bij elke tweede klik? Zet resolution dan op 2.
    resolution: 1
    min_value: 0
    max_value: ${clicks_full}
    # Na het aanzetten staan alle platen uit.
    restore_mode: ALWAYS_ZERO

binary_sensor:
  - platform: gpio
    id: button_${index}
    internal: true
    pin:
      number: ${button_pin}
      mode: { input: true, pullup: true }
      inverted: true
    filters:
      - delayed_on_off: 20ms
    # Knop indrukken: plaat uit.
    on_press:
      - sensor.rotary_encoder.set_value:
          id: knob_${index}
          value: 0

light:
  - platform: esp32_rmt_led_strip
    id: hob_${index}
    name: ${name}
    pin: ${data_pin}
    num_leds: ${leds}
    chipset: WS2812
    channel_colors: GRB
    # De ESP32 heeft 512 RMT-symbolen: 128 per ring is precies genoeg voor vier.
    rmt_symbols: 128
    # Gamma uit, zodat de stroomgrens in hob_effect.h echt het verbruik begrenst.
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: Kookplaat
          update_interval: 50ms
          lambda: |-
            // draw_hob geeft true terug als de plaat automatisch uit moet.
            if (draw_hob(it, hobs[${index}], id(knob_${index}).state, ${clicks_full})) {
              id(knob_${index}).set_value(0);
            }
