# Speelgoedkeuken: vier kookplaten met WS2812B-ringen en vier potmeters.
# Eerste keer flashen via USB, daarna via wifi:  esphome run keukentje.yaml

substitutions:
  # Aantal LEDs per kookplaat: 93 = 1+8+12+16+24+32.
  # Andere ringen? Pas dit getal én RING_SIZES in hob_effect.h aan.
  leds_per_hob: "93"

esphome:
  name: keukentje
  friendly_name: Keukentje
  includes:
    - hob_effect.h
  on_boot:
    priority: -100
    then:
      - light.turn_on: { id: hob_0, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_1, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_2, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_3, brightness: 100%, effect: Kookplaat }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

# Nodig voor logs via wifi en voor eventuele Home Assistant-koppeling.
# reboot_timeout 0s: de keuken mag nooit herstarten omdat er geen wifi of
# Home Assistant is. De kookplaten werken ook helemaal zonder netwerk.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: Keukentje-Setup
    password: !secret ap_password

captive_portal:

# Pinkeuze:
# - Potmeters op ADC1 (GPIO32-35): ADC2 werkt niet zodra wifi aan staat.
# - LED-data op GPIO16-19: geen strapping-pins (0, 2, 5, 12, 15).
packages:
  hob_0: !include { file: hob.yaml, vars: { index: "0", name: "Kookplaat 1", knob_pin: GPIO32, data_pin: GPIO16, leds: "${leds_per_hob}" } }
  hob_1: !include { file: hob.yaml, vars: { index: "1", name: "Kookplaat 2", knob_pin: GPIO33, data_pin: GPIO17, leds: "${leds_per_hob}" } }
  hob_2: !include { file: hob.yaml, vars: { index: "2", name: "Kookplaat 3", knob_pin: GPIO34, data_pin: GPIO18, leds: "${leds_per_hob}" } }
  hob_3: !include { file: hob.yaml, vars: { index: "3", name: "Kookplaat 4", knob_pin: GPIO35, data_pin: GPIO19, leds: "${leds_per_hob}" } }
