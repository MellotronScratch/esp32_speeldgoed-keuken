# Speelgoedkeuken, voor gebruik met de ESPHome command line.
# Eerste keer flashen via USB, daarna via wifi:  esphome run keukentje.yaml
# Gebruik je de ESPHome Device Builder in Home Assistant? Neem dan home-assistant.yaml.

esphome:
  name: keukentje
  friendly_name: Keukentje

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Keukentje-Setup
    password: !secret ap_password

captive_portal:

packages:
  kookplaten: !include kookplaten.yaml
