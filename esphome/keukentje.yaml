# Speelgoedkeuken: vier kookplaten met WS2812B-ringen en vier potmeters.
# Eerste keer flashen via USB, daarna via wifi:  esphome run keukentje.yaml

substitutions:
  # Aantal LEDs per kookplaat: 93 = 1+8+12+16+24+32.
  # Andere ringen? Pas dit getal én RING_SIZES in hob_effect.h aan.
  leds_per_hob: "93"
  # Aantal klikjes van uit tot vol: 6 ringen x 2 klikjes per ring.
  clicks_full: "12"

esphome:
  name: keukentje
  friendly_name: Keukentje
  includes:
    - hob_effect.h
  on_boot:
    priority: -100
    then:
      - light.turn_on: { id: hob_0, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_1, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_2, brightness: 100%, effect: Kookplaat }
      - light.turn_on: { id: hob_3, brightness: 100%, effect: Kookplaat }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

# Nodig voor logs via wifi en voor eventuele Home Assistant-koppeling.
# reboot_timeout 0s: de keuken mag nooit herstarten omdat er geen wifi of
# Home Assistant is. De kookplaten werken ook helemaal zonder netwerk.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: Keukentje-Setup
    password: !secret ap_password

captive_portal:

# Pinkeuze:
# - Geen strapping-pins (0, 2, 5, 12, 15).
# - GPIO34 en GPIO35 hebben geen ingebouwde pull-up: daarom "pullup: false" en
#   op de print een weerstand van 10 kOhm naar 3V3.
# - Draait een knop de verkeerde kant op? Wissel dan pin_a en pin_b.
packages:
  hob_0: !include { file: hob.yaml, vars: { index: "0", name: "Kookplaat 1", pin_a: GPIO34, pin_b: GPIO35, pullup: "false", button_pin: GPIO32, data_pin: GPIO16, leds: "${leds_per_hob}", clicks_full: "${clicks_full}" } }
  hob_1: !include { file: hob.yaml, vars: { index: "1", name: "Kookplaat 2", pin_a: GPIO33, pin_b: GPIO25, pullup: "true", button_pin: GPIO26, data_pin: GPIO17, leds: "${leds_per_hob}", clicks_full: "${clicks_full}" } }
  hob_2: !include { file: hob.yaml, vars: { index: "2", name: "Kookplaat 3", pin_a: GPIO27, pin_b: GPIO14, pullup: "true", button_pin: GPIO13, data_pin: GPIO18, leds: "${leds_per_hob}", clicks_full: "${clicks_full}" } }
  hob_3: !include { file: hob.yaml, vars: { index: "3", name: "Kookplaat 4", pin_a: GPIO23, pin_b: GPIO22, pullup: "true", button_pin: GPIO21, data_pin: GPIO19, leds: "${leds_per_hob}", clicks_full: "${clicks_full}" } }
